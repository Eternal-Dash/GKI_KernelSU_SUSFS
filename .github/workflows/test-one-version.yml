# =============================================================================
# 单版本验证入口（用于复现/验证某个具体的 android×kernel×sub_level）
# 只调用 build.yml 一次，不跑 matrix，适合验证补丁类问题。
# =============================================================================
name: 单版本验证

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options: [android12, android13, android14, android15, android16]
        default: android14
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options: ["5.10", "5.15", "6.1", "6.6", "6.12"]
        default: "6.1"
      sub_level:
        description: "子版本号（如 138）"
        required: true
        type: string
        default: "138"
      os_patch_level:
        description: "安全补丁级别（如 2025-06）"
        required: true
        type: string
        default: "2025-06"
      ksu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: SukiSU
      ksu_mode:
        description: "模式"
        required: true
        type: choice
        options: [关闭, 禁用SUSFS, 禁用KSU]
        default: 关闭
      use_kpm:
        description: "KPM"
        required: true
        type: choice
        options:
          - "disabled (关闭)"
          - "enabled (开启，注入 KernelPatch 宿主)"
          - "patched (与 enabled 等效，同样注入宿主)"
        default: "disabled (关闭)"
      artifact_upload_mode:
        description: "产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "上传全部"
      kmi_tag:
        description: "覆盖 KMI 标签（如 android14-11），留空按内置映射"
        required: false
        type: string
        default: ""
      localversion_override:
        description: "显式版本串（可粘贴完整 uname -r 结果），留空则自动生成"
        required: false
        type: string
        default: ""
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_mode: ${{ inputs.ksu_mode }}
      use_kpm: ${{ inputs.use_kpm }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: false
      use_nomount: false
      use_networking: false
      cve_2026_43499_patch: false
      export_susfs_patches: ${{ inputs.export_susfs_patches }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      droidspaces: "off"
      droidspaces_ntsync: false
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}
      kmi_tag: ${{ inputs.kmi_tag }}
      localversion_override: ${{ inputs.localversion_override }}
