name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（enabled 与 patched 等效，均注入 KernelPatch 宿主；仅 SukiSU / BakaSU / Next 生效，未实测）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启，注入 KernelPatch 宿主)"
          - "patched (与 enabled 等效，同样注入宿主)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      # ==================== 文本输入 ====================
      sub_level:
        description: "直接指定内核子版本（如 89 = 6.6.89，也可填 6.6.89 / lts）；填了就以它为准"
        required: false
        type: string
        default: ""
      os_patch_level:
        description: "安全补丁级别（如 2025-06；仅在未填上面子版本时生效。对应关系：2025-06=6.6.89、2026-01=6.6.118）"
        required: false
        type: string
        default: ""
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
    steps:
      - name: 检出版本数据
        uses: actions/checkout@v7

      - name: 解析安全补丁级别
        id: resolve
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ inputs.os_patch_level }}
          SUB_LEVEL: ${{ inputs.sub_level }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          kernel_version = os.environ["KERNEL_VERSION"].strip()
          os_patch_level = (os.environ.get("OS_PATCH_LEVEL") or "").strip()
          sub_level_in = (os.environ.get("SUB_LEVEL") or "").strip()
          android_map = {
              "5.10": "android12",
              "5.15": "android13",
              "6.1": "android14",
              "6.6": "android15",
              "6.12": "android16",
          }
          android_version = android_map.get(kernel_version)
          if android_version is None:
              print(f"::error::未适配的内核版本: {kernel_version}")
              sys.exit(1)

          data_path = Path("data") / android_version / f"{kernel_version}.json"
          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          with data_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          entries = data.get("entries", [])
          # 同一个内核号在数据里可能出现多次（不同补丁级别），构建时取最后一条
          by_kernel = {}
          for e in entries:
              by_kernel[e.get("kernel", "")] = e

          def available():
              items = [f'{e["kernel"]}({e["date"]})' for e in by_kernel.values()]
              lts = data.get("lts")
              if lts:
                  items.append(f"{lts}(lts)")
              return ", ".join(items)

          kernel_full = ""
          sub_level = ""
          date = ""

          if sub_level_in:
              # 直接按内核子版本选择：支持 89 / 6.6.89 / lts / X
              token = sub_level_in.lower().lstrip("v")
              if token in ("lts", "x"):
                  kernel_full = data.get("lts") or ""
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                      sys.exit(1)
                  sub_level = "X"
                  date = "lts"
              else:
                  token = token.split(".")[-1]
                  kernel_full = f"{kernel_version}.{token}"
                  matched = by_kernel.get(kernel_full)
                  if matched is None:
                      print(f"::error::没有 {kernel_full} 这个版本。可选：{available()}")
                      sys.exit(1)
                  sub_level = token
                  date = matched["date"]
          elif os_patch_level:
              if os_patch_level.lower() == "lts":
                  kernel_full = data.get("lts") or ""
                  if not kernel_full:
                      print(f"::error::{android_version} / {kernel_version} 缺少 LTS 版本数据")
                      sys.exit(1)
                  sub_level = "X"
                  date = "lts"
              else:
                  matched = next((e for e in entries if e.get("date") == os_patch_level), None)
                  if matched is None:
                      print(f"::error::没有 {os_patch_level} 这个补丁级别。可选：{available()}")
                      sys.exit(1)
                  kernel_full = matched.get("kernel", "")
                  prefix = f"{kernel_version}."
                  if not kernel_full.startswith(prefix):
                      print(f"::error::版本数据异常: {kernel_full} 不属于 {kernel_version}")
                      sys.exit(1)
                  sub_level = kernel_full.rsplit(".", 1)[-1]
                  date = os_patch_level
          else:
              print("::error::请填写「内核子版本」（如 89）或「安全补丁级别」（如 2025-06）二者之一。")
              print(f"::error::可选：{available()}")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"android_version={android_version}\n")
              output.write(f"sub_level={sub_level}\n")
              output.write(f"kernel_full={kernel_full}\n")
              output.write(f"os_patch_level={date}\n")

          print(f"解析结果: {android_version} / {kernel_full}，子版本号 {sub_level}，补丁级别 {date}")
          PY

  build-custom-kernel:
    name: "${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ needs.resolve-version.outputs.os_patch_level }}"
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ needs.resolve-version.outputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-version.outputs.sub_level }}
      os_patch_level: ${{ needs.resolve-version.outputs.os_patch_level }}
      revision: "r1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
